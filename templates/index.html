<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />

    <title>House Price Prediction</title>

    <style>

        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }

        body {
            background: #f4f7fb;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            padding: 20px;
        }

        .container {
            width: 100%;
            max-width: 500px;
            background: white;
            padding: 30px;
            border-radius: 12px;
            box-shadow: 0px 4px 12px rgba(0,0,0,0.1);
        }

        h1 {
            text-align: center;
            margin-bottom: 25px;
            color: #1e3a8a;
        }

        .input-group {
            margin-bottom: 15px;
        }

        label {
            display: block;
            margin-bottom: 6px;
            font-weight: bold;
            color: #333;
        }

        input {
            width: 100%;
            padding: 10px;
            border: 1px solid #ccc;
            border-radius: 8px;
            font-size: 14px;
        }

        button {
            width: 100%;
            padding: 12px;
            border: none;
            border-radius: 8px;
            background: #2563eb;
            color: white;
            font-size: 16px;
            cursor: pointer;
            margin-top: 15px;
        }

        button:hover {
            background: #1d4ed8;
        }

        .result {
            margin-top: 20px;
            padding: 15px;
            background: #eef2ff;
            border-radius: 8px;
            text-align: center;
            font-size: 18px;
            font-weight: bold;
            color: #1e3a8a;
        }

    </style>
</head>

<body>

    <div class="container">

        <h1>House Price Prediction</h1>

        <div class="input-group">
            <label>Median Income</label>
            <input type="number" id="MedInc" step="any" value="8.3252">
        </div>

        <div class="input-group">
            <label>House Age</label>
            <input type="number" id="HouseAge" step="any" value="41">
        </div>

        <div class="input-group">
            <label>Average Rooms</label>
            <input type="number" id="AveRooms" step="any" value="6.984">
        </div>

        <div class="input-group">
            <label>Average Bedrooms</label>
            <input type="number" id="AveBedrms" step="any" value="1.023">
        </div>

        <div class="input-group">
            <label>Population</label>
            <input type="number" id="Population" step="any" value="322">
        </div>

        <div class="input-group">
            <label>Average Occupancy</label>
            <input type="number" id="AveOccup" step="any" value="2.555">
        </div>

        <div class="input-group">
            <label>Latitude</label>
            <input type="number" id="Latitude" step="any" value="37.88">
        </div>

        <div class="input-group">
            <label>Longitude</label>
            <input type="number" id="Longitude" step="any" value="-122.23">
        </div>

        <button onclick="predictPrice()">
            Predict Price
        </button>

        <div class="result" id="result">
            Predicted Price: --
        </div>

    </div>

    <script>

        async function predictPrice() {

            const data = {

                MedInc: parseFloat(
                    document.getElementById("MedInc").value
                ),

                HouseAge: parseFloat(
                    document.getElementById("HouseAge").value
                ),

                AveRooms: parseFloat(
                    document.getElementById("AveRooms").value
                ),

                AveBedrms: parseFloat(
                    document.getElementById("AveBedrms").value
                ),

                Population: parseFloat(
                    document.getElementById("Population").value
                ),

                AveOccup: parseFloat(
                    document.getElementById("AveOccup").value
                ),

                Latitude: parseFloat(
                    document.getElementById("Latitude").value
                ),

                Longitude: parseFloat(
                    document.getElementById("Longitude").value
                )
            };

            try {

                const response = await fetch("/predict", {

                    method: "POST",

                    headers: {
                        "Content-Type": "application/json"
                    },

                    body: JSON.stringify(data)

                });

                const result = await response.json();

                document.getElementById("result").innerHTML =
                    "Predicted Price: " +
                    result["Predicted Price"];

            }

            catch (error) {

                document.getElementById("result").innerHTML =
                    "Error connecting to API";

                console.error(error);
            }
        }

    </script>

</body>

</html>
